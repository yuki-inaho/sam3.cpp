<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sam3 Annotator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <strong class="brand">sam3 Annotator</strong>
  <span id="imageName" class="file">画像未読み込み</span>
  <span id="status" class="status">起動中…</span>
</header>

<main class="layout">
  <aside class="panel">
    <section>
      <h2>モデル</h2>
      <div class="row">
        <input id="modelPath" type="text" placeholder="models/edgetam_q8_0.ggml"
               value="models/edgetam_q8_0.ggml">
        <button id="browseModel" class="ghost" title="参照">…</button>
      </div>
      <label class="check"><input id="cpu" type="checkbox" checked> CPU を使う</label>
      <label class="row small">スレッド
        <input id="threads" type="number" min="1" max="32" value="4">
      </label>
      <button id="startModel" class="primary">モデル開始</button>
      <p class="hint">読み込みと画像エンコードに数秒かかります。以降のプロンプトは高速です。</p>
    </section>

    <section>
      <h2>画像</h2>
      <button id="openImage">画像を開く</button>
      <button id="fit" class="ghost">全体表示</button>
    </section>

    <section>
      <h2>プロンプト</h2>
      <div class="modes">
        <button data-mode="point" class="on">点</button>
        <button data-mode="box">矩形</button>
      </div>
      <p class="hint">クリックで前景、<kbd>Shift</kbd>+クリック か右クリックで背景。ホイールで拡大。</p>
      <label class="check"><input id="auto" type="checkbox" checked> クリックごとに自動実行</label>
      <label class="check"><input id="multimask" type="checkbox"> 候補を 3 つ出す</label>
      <div class="row">
        <button id="segment">実行 <kbd>Space</kbd></button>
        <button id="clear" class="ghost">消去 <kbd>Esc</kbd></button>
      </div>
      <div id="candidates" class="chips"></div>
      <div class="row">
        <input id="label" type="text" placeholder="ラベル名" value="object">
        <button id="accept" class="primary" disabled>確定 <kbd>↵</kbd></button>
      </div>
    </section>

    <section class="grow">
      <h2>インスタンス <span id="count" class="badge">0</span></h2>
      <ul id="instances" class="instances"></ul>
    </section>

    <section>
      <button id="export" class="primary" disabled>COCO を書き出す</button>
    </section>
  </aside>

  <div class="stage">
    <canvas id="canvas"></canvas>
  </div>
</main>

<script src="rle.js"></script>
<script src="coco.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
