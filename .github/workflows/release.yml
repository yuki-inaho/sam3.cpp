name: Release

on:
  push:
    # Integration branches build and verify the bundle but never publish
    # (the release job is gated on a tag ref), so tagging is always a
    # release of something that has already run on the target.
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

env:
  ARTIFACT: sam3-linux-x86_64

jobs:
  build:
    name: Build Linux x86_64 (demo bundle)
    # ubuntu-latest floats, and the runner's glibc sets the minimum glibc of
    # the produced binaries, so pin the image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # ggml is vendored in-tree (pinned snapshot), no submodules needed

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-${{ env.ARTIFACT }}

      # AVX2 fixed (no GGML_NATIVE) so the binary runs on any x86_64 since
      # Haswell; no OpenMP and static libstdc++/libgcc so it does not depend
      # on the build machine's runtime
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_METAL=OFF -DSAM3_METAL=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON
          -DGGML_OPENMP=OFF
          -DCMAKE_SKIP_RPATH=ON
          -DCMAKE_EXE_LINKER_FLAGS='-static-libstdc++ -static-libgcc'
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p "staging/$ARTIFACT"/{lib,include,bin,data}

          cp build/libsam3.a "staging/$ARTIFACT/lib/"
          find build/ggml -name "*.a" -exec cp {} "staging/$ARTIFACT/lib/" \;

          cp sam3.h "staging/$ARTIFACT/include/"
          cp -r ggml/include/* "staging/$ARTIFACT/include/"

          for bin in sam3_seg sam3_quantize sam3_benchmark sam3_profile_edgetam; do
            cp "build/examples/$bin" "staging/$ARTIFACT/bin/"
          done

          cp -r models "staging/$ARTIFACT/models"
          cp data/test_image.jpg data/test_video.mp4 "staging/$ARTIFACT/data/"
          cp README-release.md "staging/$ARTIFACT/README.md"

          tar czf "$ARTIFACT.tar.gz" -C staging "$ARTIFACT"
          ls -lh "$ARTIFACT.tar.gz"

      # The target environment is Debian 13 (glibc 2.41) with no guaranteed
      # libgomp/libstdc++ runtime, so assert those properties on the packaged
      # binaries rather than trusting the build flags
      - name: Audit portability
        run: |
          cd "staging/$ARTIFACT"
          fail=0
          for f in bin/*; do
            echo "--- $f"
            ldd "$f" || true
            need=$(objdump -T "$f" | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -uV | tail -1)
            echo "max GLIBC required: ${need:-none}"
            if [ -n "$need" ] && [ "$(printf '%s\n2.41\n' "$need" | sort -V | tail -1)" != "2.41" ]; then
              echo "ERROR: requires GLIBC $need, target has 2.41"
              fail=1
            fi
            for lib in libgomp libstdc++; do
              if ldd "$f" | grep -q "$lib"; then
                echo "ERROR: links $lib dynamically (expected static/absent)"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz

  verify-linux:
    name: Verify bundle in target env (Debian 13)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}

      - name: Extract
        run: tar xzf "$ARTIFACT.tar.gz"

      # debian:13 is the deployment target (trixie, glibc 2.41). Running the
      # shipped binaries there is the only real proof the bundle is portable.
      - name: Run the bundle inside debian:trixie
        run: |
          docker run --rm -v "$PWD/$ARTIFACT:/bundle" -w /bundle debian:13 \
            bash -euo pipefail -c '
              echo "debian $(cat /etc/debian_version)"
              # `head -1` here would race: ldd --version echoes several lines
              # and head closing the pipe first kills it with SIGPIPE, which
              # pipefail then turns into a spurious 141. sed reads all input.
              ldd --version | sed -n 1p
              ldd bin/sam3_seg

              ./bin/sam3_seg --model models/edgetam_q8_0.ggml \
                             --image data/test_image.jpg --x 315 --y 250 \
                             --out /tmp/mask.png --cpu
              test -s /tmp/mask.png
              echo "OK: sam3_seg produced $(stat -c %s /tmp/mask.png) byte mask"

              # the video path needs the ffmpeg CLI (documented in README-release);
              # this is what the ffmpeg 8 `-vsync` removal broke, so exercise it.
              # sam3_benchmark exits 0 even when a run fails, so assert on its
              # SUMMARY line instead of the exit status.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null
              ./bin/sam3_benchmark --models-dir models --video data/test_video.mp4 \
                                   --filter edgetam_q8_0 --cpu-only --n-frames 3 \
                | tee /tmp/bench.txt
              grep -q "0 FAIL" /tmp/bench.txt
            '

  release:
    name: Create Release
    needs: [build, verify-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: sam3.cpp ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: ${{ env.ARTIFACT }}.tar.gz
